        const DcrRadarChart = ({ scores }) => {
            const totalRaw = scores.authoritative + scores.authoritarian + scores.permissive + scores.neglectful;
            
            // 修正后的DCR映射逻辑
            // Demand (要求): Auth(High) + Authoritarian(High)
            const dScore = ((scores.authoritative + scores.authoritarian) / (totalRaw || 1)) * 100;
            
            // Response (回应): Auth(High) + Permissive(High)
            const rScore = ((scores.authoritative + scores.permissive) / (totalRaw || 1)) * 100;
            
            // Control (掌控/干预): Auth(High) + Authoritarian(High) - Neglectful(Low) - Permissive(Low)
            // 为了图表好看，我们重新定义一下Control的轴向，这里取"结构化程度"
            const cScore = ((scores.authoritative + scores.authoritarian * 0.9 + scores.neglectful * 0.1) / (totalRaw || 1)) * 100;

            const center = { x: 100, y: 100 };
            const radius = 80;
            
            const getPoint = (angle, value) => {
                const rad = (angle - 90) * (Math.PI / 180);
                const adjustedValue = 20 + (value * 0.8); 
                const dist = (adjustedValue / 100) * radius;
                return {
                x: center.x + dist * Math.cos(rad),
                y: center.y + dist * Math.sin(rad)
                };
            };

            const pDemand = getPoint(0, dScore);
            const pResponse = getPoint(120, rScore);
            const pControl = getPoint(240, cScore);

            const polyPoints = `${pDemand.x},${pDemand.y} ${pResponse.x},${pResponse.y} ${pControl.x},${pControl.y}`;

                    <line x1="100" y1="100" x2="30.72" y2="140" stroke="#cbd5e1" />
                    <polygon points={polyPoints} fill="rgba(37, 99, 235, 0.3)" stroke="#2563eb" strokeWidth="2" />
                    <text x="100" y="15" textAnchor="middle" className="text-[10px] fill-slate-500 font-bold">要求 (Demand)</text>
                    <text x="175" y="150" textAnchor="middle" className="text-[10px] fill-slate-500 font-bold">回应 (Response)</text>
                    <text x="25" y="150" textAnchor="middle" className="text-[10px] fill-slate-500 font-bold">结构 (Structure)</text>
                    <circle cx={pDemand.x} cy={pDemand.y} r="4" fill="#1d4ed8" />
                    <circle cx={pResponse.x} cy={pResponse.y} r="4" fill="#1d4ed8" />
                    <circle cx={pControl.x} cy={pControl.y} r="4" fill="#1d4ed8" />
                    </svg>
                </div>
                </div>
            );
        };

                            className="inline-flex items-center px-8 py-3 bg-gray-900 text-white rounded-full font-bold hover:bg-black transition-all shadow-lg hover:shadow-xl hover:-translate-y-1"
                        >
                            <RotateCcw className="w-4 h-4 mr-2" /> 重新测试
                        </button>
                        </div>
                    </div>
                    </div>
                </div>
                );
            }

            return (
                <div className={`min-h-screen transition-colors duration-700 font-sans text-gray-800 pb-24
                ${isScene2 ? 'bg-orange-50/40' : 'bg-slate-50'}
                `}>
                {/* 顶部进度条 */}
                <div className="fixed top-0 left-0 w-full h-1.5 bg-slate-200 z-50">
                    <div 
                    className={`h-full transition-all duration-500 ease-out ${isScene2 ? 'bg-orange-500' : 'bg-blue-600'}`} 
                    style={{ width: `${progressPercent}%` }}
                    ></div>
                </div>

                <div className="max-w-2xl mx-auto px-4 py-8 mt-4">
                    
                    {/* 场景导航头 */}
                    <div className="flex items-center justify-between mb-8 animate-fade-in">
                    <div>
                        <div className="text-xs font-bold text-gray-400 uppercase tracking-widest mb-1">
                        Topic {currentTopicIndex + 1} / {topics.length}
                        </div>
                        <h1 className="text-xl font-bold text-gray-800 flex items-center">
                        {currentTopic.title}
                        </h1>
                    </div>
                    
                    <div className="flex items-center space-x-1 bg-white p-1 rounded-full shadow-sm border border-gray-100">
                        <div className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all duration-300
                        ${!isScene2 ? 'bg-blue-100 text-blue-700' : 'text-gray-400'}
                        `}>
                        常态
                        </div>
                        <ChevronRight className="w-3 h-3 text-gray-300" />
                        <div className={`px-4 py-1.5 rounded-full text-xs font-bold transition-all duration-300 flex items-center
                        ${isScene2 ? 'bg-orange-100 text-orange-700' : 'text-gray-400'}
                        `}>
                        {isScene2 && <Zap className="w-3 h-3 mr-1" />}
                        压力
                        </div>
                    </div>
                    </div>

                    {/* 核心卡片 */}
                    <div className={`bg-white rounded-[2rem] shadow-xl overflow-hidden border transition-all duration-500 relative
                    ${isScene2 ? 'border-orange-100 shadow-orange-100/50' : 'border-blue-100 shadow-blue-100/50'}
                    `}>
                    {/* 场景描述区 */}
                    <div className={`p-8 text-white transition-colors duration-700 relative overflow-hidden
                        ${isScene2 ? 'bg-gradient-to-br from-orange-500 to-red-500' : 'bg-gradient-to-br from-blue-500 to-indigo-600'}
                    `}>
                        <div className="relative z-10">
                        <div className="flex items-center mb-4 opacity-90 text-sm font-bold uppercase tracking-wider">
                            {isScene2 ? <AlertTriangle className="w-4 h-4 mr-2"/> : <Target className="w-4 h-4 mr-2"/>}
                            {currentSceneData.title}
                        </div>
                        <h2 className="text-2xl font-bold leading-snug">{currentSceneData.description}</h2>
                        </div>
                        {/* 装饰圆 */}
                        <div className="absolute -bottom-10 -right-10 w-40 h-40 bg-white opacity-10 rounded-full blur-3xl"></div>
                    </div>

                    <div className="p-6 sm:p-8">
                        <p className="text-sm text-gray-400 mb-8 italic text-center">
                        请根据您的**真实第一反应**打分，没有对错之分。
                        </p>

                        <div className="space-y-12">
                        {currentSceneData.options.map((option, idx) => {
                            const isAnswered = answers[`${currentTopic.id}-${currentSceneKey}-${option.style}`] !== undefined;
                            return (
                            <div key={idx} className={`transition-all duration-500 ${isAnswered ? 'opacity-60 grayscale-[0.5]' : 'opacity-100'}`}>
                                <div className="flex items-start mb-3">
                                <div className={`flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm mr-4 mt-1
                                    ${isScene2 ? 'bg-orange-50 text-orange-600' : 'bg-blue-50 text-blue-600'}
                                `}>
                                    {String.fromCharCode(65 + idx)}
                                </div>
                                <div>
                                    <p className="text-gray-800 text-lg font-medium leading-relaxed">{option.text}</p>
                                    <div className="inline-flex items-center mt-2 px-2 py-1 bg-gray-50 rounded text-xs text-gray-500 font-medium">
                                    <Target className="w-3 h-3 mr-1 opacity-50" />
                                    {option.intent}
                                    </div>
                                </div>
                                </div>
                                
                                <LikertScale 
                                value={answers[`${currentTopic.id}-${currentSceneKey}-${option.style}`]}
                                onChange={(val) => handleScore(option.style, val)}
                                isScene2={isScene2}
                                />
                                
                                {idx < currentSceneData.options.length - 1 && (
                                <div className="h-px bg-gray-100 w-full mx-auto mt-8 mb-4"></div>
                                )}
                            </div>
                            );
                        })}
                        </div>
                    </div>
                    </div>
                </div>

                {/* 底部悬浮导航 */}
                <div className="fixed bottom-0 left-0 w-full bg-white/90 backdrop-blur-md border-t border-gray-100 p-4 z-40 shadow-lg-up">
                    <div className="max-w-2xl mx-auto flex justify-between items-center">
                    <button 
                        onClick={handlePrev} 
                        disabled={currentTopicIndex === 0 && !isScene2}
                        className={`flex items-center px-5 py-2.5 rounded-xl font-medium text-gray-600 hover:bg-gray-100 disabled:opacity-30 transition-colors`}
                    >
                        <ChevronLeft className="w-5 h-5 mr-1"/>
                    </button>

                    <button
                        onClick={handleNext}
                        disabled={!isCurrentComplete}
                        className={`flex items-center px-8 py-3 rounded-full font-bold text-white shadow-xl transition-all hover:-translate-y-1 active:translate-y-0
                        ${!isCurrentComplete 
                            ? 'bg-gray-200 text-gray-400 cursor-not-allowed shadow-none' 
                            : isScene2 
                            ? 'bg-gray-900 hover:bg-black' 
                            : 'bg-blue-600 hover:bg-blue-700 shadow-blue-500/30'}
                        `}
                    >
                        {isScene2 
                        ? (currentTopicIndex === topics.length - 1 ? '生成深度报告' : '下一个话题') 
                        : '进入 Scene 2'
                        }
                        <ChevronRight className="w-5 h-5 ml-2"/>
                    </button>
                    </div>
                </div>
                </div>
            );
            }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
